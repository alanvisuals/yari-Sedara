<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>


<div class="wrap" lang="ckb">
<div class="board">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="carpet" width="56" height="56" patternUnits="userSpaceOnUse">
        <rect width="56" height="56" fill="#7E1717"/>
        <polygon points="28,4 52,28 28,52 4,28" fill="#E9D8B0"/><polygon points="28,10 46,28 28,46 10,28" fill="#1E2B4A"/><polygon points="28,17 39,28 28,39 17,28" fill="#C9372C"/>
        <rect x="25" y="25" width="6" height="6" fill="#E0AE46"/>
        <polygon points="0,0 10,0 0,10" fill="#2F6B3A"/><polygon points="56,0 46,0 56,10" fill="#2F6B3A"/><polygon points="0,56 10,56 0,46" fill="#2F6B3A"/><polygon points="56,56 46,56 56,46" fill="#2F6B3A"/>
        <circle cx="0" cy="28" r="3" fill="#E0AE46"/><circle cx="56" cy="28" r="3" fill="#E0AE46"/><circle cx="28" cy="0" r="3" fill="#E0AE46"/><circle cx="28" cy="56" r="3" fill="#E0AE46"/>
      </pattern>
    </defs>
  </svg>

  <!-- mountain village scene behind everything -->
  <svg class="scene" id="scene" viewBox="0 0 1536 1024" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6AA2D4"/><stop offset=".55" stop-color="#BBD8EA"/><stop offset="1" stop-color="#E7EFEC"/></linearGradient>
      <linearGradient id="gfar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CA6C2"/><stop offset="1" stop-color="#BCCDDA"/></linearGradient>
      <linearGradient id="grock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8A396"/><stop offset=".6" stop-color="#7F8268"/><stop offset="1" stop-color="#506B44"/></linearGradient>
      <linearGradient id="gmid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F8658"/><stop offset="1" stop-color="#2D5832"/></linearGradient>
      <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <rect width="1536" height="1024" fill="url(#gsky)"/>
    <g fill="#fff" opacity=".8" filter="url(#blur)"><ellipse cx="220" cy="230" rx="150" ry="34"/><ellipse cx="330" cy="205" rx="90" ry="38"/><ellipse cx="620" cy="190" rx="170" ry="30"/><ellipse cx="900" cy="170" rx="120" ry="28"/><ellipse cx="1260" cy="150" rx="140" ry="26"/><ellipse cx="460" cy="330" rx="110" ry="22"/></g>
    <polygon points="0,440 140,390 300,430 470,370 640,440 800,405 1000,480 1000,720 0,720" fill="url(#gfar)"/>
    <polygon points="740,720 900,520 1060,420 1220,300 1340,220 1440,175 1536,150 1536,720" fill="url(#grock)"/>
    <polygon points="1220,300 1340,220 1440,175 1500,200 1420,290 1300,380" fill="#E1DAC4" opacity=".45"/>
    <polygon points="1000,470 1120,400 1240,330 1300,380 1180,470" fill="#5E6150" opacity=".35"/>
    <polygon points="640,720 820,580 1000,500 1180,455 1360,440 1536,430 1536,720" fill="url(#gmid)"/>
    <polygon points="0,540 160,480 360,490 560,550 700,630 700,720 0,720" fill="url(#gmid)"/>
    <g id="houses"></g><g id="trees"></g>
    <rect y="680" width="1536" height="344" fill="#244d2a"/>
  </svg>

  <svg class="corner" viewBox="0 0 150 150" aria-hidden="true"><polygon points="0,0 150,0 0,150" fill="url(#carpet)"/><path d="M150 0 L0 150" stroke="#E0AE46" stroke-width="5"/></svg>

  <header class="bar">
    <div class="brand">
      <svg class="orn" viewBox="0 0 22 22" aria-hidden="true"><polygon points="11,1 21,11 11,21 1,11" fill="#B3261E" stroke="#E0AE46" stroke-width="1.5"/><polygon points="11,6 16,11 11,16 6,11" fill="#2F6B3A"/></svg>
      <svg class="flag" viewBox="0 0 120 80" aria-hidden="true">
        <defs><clipPath id="fclip"><path d="M4 12 Q30 2 60 10 T116 8 L112 40 L117 70 Q88 78 60 70 T5 72 L9 42Z"/></clipPath></defs>
        <g clip-path="url(#fclip)"><rect width="120" height="28" fill="#D5242B"/><rect y="26" width="120" height="28" fill="#fff"/><rect y="52" width="120" height="30" fill="#1F8A3A"/></g>
        <g id="flagsun" transform="translate(60 41)"></g>
      </svg>
      <div class="titles"><h1>پیاوی جەمەدانی</h1><div class="edition">وەشانی کوردی</div></div>
      <svg class="orn" viewBox="0 0 22 22" aria-hidden="true"><polygon points="11,1 21,11 11,21 1,11" fill="#B3261E" stroke="#E0AE46" stroke-width="1.5"/><polygon points="11,6 16,11 11,16 6,11" fill="#2F6B3A"/></svg>
    </div>
    <div class="pills">
      <button class="pill" id="soundbtn" type="button" aria-label="دەنگ" aria-pressed="true">🔊</button>
      <div class="pill" aria-label="زنجیرەی سەرکەوتن">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2 C20 9 28 12 28 22 C28 29 23 34 18 34 C12 34 8 29 8 23 C8 18 11 16 12 12 C14 14 15 16 16 17 C16 11 15 6 18 2Z" fill="#F26A1B"/><path d="M18 14 C19 19 23 20 23 25 C23 29 21 31 18 31 C15 31 13 29 13 26 C13 22 17 20 18 14Z" fill="#FFC531"/></svg>
        <span class="tx">زنجیرە: <b class="num" id="streak">٠</b></span>
      </div>
      <div class="pill" aria-label="باشترین زنجیرە">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 4H26V14C26 19 22 23 18 23C14 23 10 19 10 14Z" fill="#F1C65E" stroke="#9A6B1A" stroke-width="1.5"/><path d="M10 7H4C4 14 7 17 11 18M26 7H32C32 14 29 17 25 18" fill="none" stroke="#E0AE46" stroke-width="2.4"/><rect x="16" y="23" width="4" height="6" fill="#E0AE46"/><rect x="10" y="29" width="16" height="4" rx="1" fill="#C8951A"/></svg>
        <span class="tx">باشترین: <b id="best">٠</b></span>
      </div>
    </div>
  </header>

  <main class="field">
    <div class="figure">
      <svg class="fig" id="fig" viewBox="-16 0 306 520" role="img" aria-label="پیاوی جەمەدانی">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86BDE6"/><stop offset="1" stop-color="#DDEBF2"/></linearGradient>
          <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB5CB"/><stop offset="1" stop-color="#C9D8E4"/></linearGradient>
          <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F9AB5"/><stop offset="1" stop-color="#B2C6D6"/></linearGradient>
          <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#668399"/><stop offset="1" stop-color="#9DB4C2"/></linearGradient>
          <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C7A3F"/><stop offset="1" stop-color="#1F4D2A"/></linearGradient>
          <radialGradient id="tree" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#58A054"/><stop offset="1" stop-color="#1F5A2C"/></radialGradient>
          <pattern id="kef" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
            <rect width="9" height="9" fill="#F8F4EA"/><rect width="4.5" height="4.5" fill="#1F1A17"/><rect x="4.5" y="4.5" width="4.5" height="4.5" fill="#1F1A17"/>
            <path d="M0 4.5H9M4.5 0V9" stroke="#8A8478" stroke-width=".6"/>
          </pattern>
          <pattern id="sashp" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#FFD58A" stroke-width="1"/><circle cx="3" cy="3" r=".9" fill="#1F1A17"/></pattern>
          <g id="armL">
            <path class="o jk" d="M90 172 Q68 182 62 226 L58 264 L82 270 Q86 236 104 200Z"/>
            <path d="M86 182 Q73 196 69 228" stroke="#fff" opacity=".2" fill="none" stroke-width="4" stroke-linecap="round"/>
            <path class="o" fill="#fff" d="M56 262 L83 269 L81 282 L54 275Z"/>
            <ellipse class="o skin" cx="67" cy="297" rx="11" ry="14"/>
            <path class="o" fill="none" d="M61 305 v7 M67 307 v8 M73 305 v7"/>
            <ellipse class="o skin" cx="78" cy="292" rx="4" ry="7" transform="rotate(-20 78 292)"/>
          </g>
          <g id="footL">
            <path class="o skin" d="M104 438 Q100 462 108 472 Q120 479 133 470 Q137 458 134 438Z"/>
            <g class="o skin"><circle cx="107" cy="473" r="4"/><circle cx="114" cy="477" r="4"/><circle cx="122" cy="478" r="4"/><circle cx="129" cy="476" r="3.6"/><circle cx="134" cy="471" r="3.2"/></g>
          </g>
        </defs>

        <!-- wooden beam and corner piece -->
        <g class="p" id="p0">
          <rect class="o wood" x="-8" y="-4" width="24" height="486"/>
          <rect class="o wood" x="-16" y="480" width="88" height="16" rx="2"/>
          <rect class="o wood" x="-8" y="-4" width="194" height="20"/>
          <polygon class="o wood" points="16,16 16,74 72,16"/>
          <path d="M-4 3H182" stroke="#C48A4A" stroke-width="2"/>
        </g>

        <g class="man">
          <!-- rope -->
          <g class="p" id="p1"><path d="M145 16V54" stroke="#3A2113" stroke-width="6.5" stroke-linecap="round"/><path d="M145 16V54" stroke="#D9B988" stroke-width="3" stroke-linecap="round"/></g>

          <!-- bare feet -->
          <g class="p" id="p9"><use href="#footL"/><use href="#footL" transform="matrix(-1 0 0 1 290 0)"/></g>

          <!-- baggy trousers (shalwar) -->
          <g class="p" id="p8">
            <path class="o tr" d="M84 290 L206 290 Q218 345 190 428 L156 428 Q148 382 145 352 Q142 382 134 428 L100 428 Q72 345 84 290Z"/>
            <path d="M145 352 Q140 330 120 300 L145 296 L170 300 Q150 330 145 352Z" fill="#000" opacity=".16"/>
            <path d="M104 300 Q94 350 112 420 M126 306 Q122 360 122 420 M186 300 Q196 350 178 420 M164 306 Q168 360 168 420" stroke="#000" opacity=".22" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M92 300 Q86 340 98 380" stroke="#fff" opacity=".18" fill="none" stroke-width="5" stroke-linecap="round"/>
            <rect class="o" x="98" y="424" width="40" height="16" rx="5" fill="#5E3A19"/><rect class="o" x="152" y="424" width="40" height="16" rx="5" fill="#5E3A19"/>
          </g>

          <!-- white shirt, collar and neck -->
          <g class="p" id="p4">
            <ellipse class="o skin" cx="145" cy="166" rx="15" ry="11"/>
            <path class="o" fill="#fff" d="M116 168 L145 192 L174 168 L176 268 L114 268Z"/>
            <path class="o" fill="#F1ECE0" d="M117 160 L145 190 L128 192Z"/><path class="o" fill="#F1ECE0" d="M173 160 L145 190 L162 192Z"/>
          </g>

          <!-- open brown jacket -->
          <g class="p" id="p5">
            <path class="o jk" d="M86 178 Q100 164 118 164 L130 192 L124 266 L90 266 Q82 224 86 178Z"/>
            <path class="o jk" d="M204 178 Q190 164 172 164 L160 192 L166 266 L200 266 Q208 224 204 178Z"/>
            <path d="M96 182 Q90 220 96 256 M194 182 Q200 220 194 256" stroke="#fff" opacity=".16" fill="none" stroke-width="5" stroke-linecap="round"/>
            <path d="M124 200 L120 262 M166 200 L170 262" stroke="#000" opacity=".25" fill="none" stroke-width="2"/>
          </g>

          <!-- woven waist sash -->
          <g class="p" id="p7">
            <rect x="80" y="258" width="130" height="8" fill="#7A1414"/><rect x="80" y="266" width="130" height="7" fill="#C0262D"/><rect x="80" y="273" width="130" height="7" fill="#E07B1F"/><rect x="80" y="280" width="130" height="7" fill="#1F1A17"/><rect x="80" y="287" width="130" height="7" fill="#C0262D"/>
            <rect x="80" y="258" width="130" height="36" fill="url(#sashp)" opacity=".55"/>
            <rect class="o" x="80" y="258" width="130" height="36" rx="6" fill="none"/>
            <path class="o" fill="#C0262D" d="M182 292 L198 326 L184 328 L174 294Z"/>
            <path d="M184 328 v8 M188 328 v8 M192 327 v8 M196 326 v8" stroke="#3A2113" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- arms: sleeves, white cuffs, hands -->
          <g class="p" id="p6"><use href="#armL"/><use href="#armL" transform="matrix(-1 0 0 1 290 0)"/></g>

          <!-- head: ears, hair, face, mustache -->
          <g class="p" id="p2">
            <ellipse class="o skin" cx="112" cy="130" rx="7" ry="10"/><ellipse class="o skin" cx="178" cy="130" rx="7" ry="10"/>
            <ellipse class="o skin" cx="145" cy="130" rx="33" ry="35"/>
            <path d="M114 106 Q110 126 115 138 L120 120 Q118 112 122 104Z" fill="#171210"/><path d="M176 106 Q180 126 175 138 L170 120 Q172 112 168 104Z" fill="#171210"/>
            <circle cx="124" cy="142" r="6" fill="#E8836B" opacity=".3"/><circle cx="166" cy="142" r="6" fill="#E8836B" opacity=".3"/>
            <path d="M122 120 L139 118 M151 118 L168 120" stroke="#171210" stroke-width="3.4" stroke-linecap="round"/>
            <g class="eyes"><ellipse cx="131" cy="129" rx="2.8" ry="3.8" fill="#171210"/><ellipse cx="159" cy="129" rx="2.8" ry="3.8" fill="#171210"/></g>
            <g class="xeyes" stroke="#171210" stroke-width="2.6" stroke-linecap="round"><path d="M126 122 l10 10 M136 122 l-10 10 M154 122 l10 10 M164 122 l-10 10"/></g>
            <path d="M143 133 Q140 141 146 141 Q150 141 148 135" fill="#E0AD7C" stroke="#3A2113" stroke-width="1.6" stroke-linejoin="round"/>
            <path class="mouth0" d="M137 156 Q145 162 153 156" fill="none" stroke="#7A2E1E" stroke-width="2" stroke-linecap="round"/>
            <path class="smile" d="M134 154 Q145 168 156 154" fill="none" stroke="#7A2E1E" stroke-width="2.4" stroke-linecap="round"/>
            <path class="frown" d="M136 162 Q145 154 154 162" fill="none" stroke="#7A2E1E" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M145 143 C138 136 126 138 120 146 C118 149 116 148 114 144 C113 151 118 156 124 154 C132 151 138 149 145 149 C152 149 158 151 166 154 C172 156 177 151 176 144 C174 148 172 149 170 146 C164 138 152 136 145 143Z" fill="#171210" stroke="#3A2113" stroke-width="1.2" stroke-linejoin="round"/>
          </g>

          <!-- keffiyeh-style checkered turban -->
          <g class="p" id="p3">
            <path class="o" fill="url(#kef)" d="M184 96 Q204 104 202 140 L192 138 Q194 118 178 110Z"/>
            <path d="M193 139 v10 M196 139 v11 M199 139 v10 M202 138 v9 M190 138 v8" stroke="#171210" stroke-width="2" stroke-linecap="round"/>
            <ellipse class="o" fill="url(#kef)" cx="145" cy="88" rx="57" ry="28"/>
            <path class="o" fill="url(#kef)" d="M98 80 Q145 106 192 78 Q200 92 192 102 Q145 118 96 102 Q90 90 98 80Z"/>
            <ellipse class="o" fill="url(#kef)" cx="145" cy="62" rx="25" ry="16"/>
            <ellipse cx="128" cy="78" rx="22" ry="8" fill="#fff" opacity=".22" transform="rotate(-18 128 78)"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="cat">
      <div class="plaque"><div class="k">بابەت:</div><div class="v" id="cat"></div><div class="len" id="len"></div></div>
      <div class="lives"><div class="dots" id="dots" aria-hidden="true"></div><span class="t" id="livestxt" aria-live="polite"></span></div>
    </div>

    <div class="word" id="word" aria-label="وشەکە"></div>

    <div class="act">
      <div id="active">
        <div class="hintrow">
          <button class="hintbtn" id="hintbtn" type="button">یارمەتی <span class="badge" id="hintnum">٣</span></button>
          <span class="hintinfo" id="hintinfo" aria-live="polite"></span>
          <button class="ghost" id="skipbtn" type="button">وشەی نوێ</button>
        </div>
      </div>
      <div class="result" id="result" hidden>
        <h2 id="rtitle"></h2>
        <div class="theword" id="rword"></div>
        <p id="rcat"></p>
        <p id="rstreak"></p>
        <button class="primary" id="nextbtn" type="button">وشەی دواتر</button>
      </div>
    </div>

    <div class="levels" id="levels" role="group" aria-label="ئاستی یاری"></div>
  </main>

  <section class="kbd" aria-label="پیتەکان"><div class="keys" id="keys"></div></section>
  <p class="note">پێشکەوتنەکەت لەم وێبسایتەدا هەڵدەگیرێت.</p>
  <p class="note">دروستکراوە لەلایەن  <a href="https://www.facebook.com/alan.nahman.412173/" target="_blank" rel="noopener noreferrer">ئالان</a>.</p>
  <svg class="band" aria-hidden="true"><rect width="100%" height="48" fill="url(#carpet)"/></svg>
</div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle" dir="rtl" lang="ckb">
    <h3 id="dtitle">دڵنیایت؟</h3>
    <p>ئەگەر ئێستا بڕۆیت بۆ وشەیەکی نوێ، ئەم یارییە بە دۆڕاو دەژمێردرێت و زنجیرەی سەرکەوتنەکەت دەبێتەوە ٠.</p>
    <div class="btns">
      <button class="primary" id="dyes" type="button">بەڵێ، بڕۆ</button>
      <button class="ghost" id="dno" type="button">نەخێر، دەمێنمەوە</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>


<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
